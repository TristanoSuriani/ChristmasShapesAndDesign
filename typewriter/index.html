<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <meta charset="UTF-8" />
    <title>Typewriter Book</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #fefefe;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        #container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            width: 100%;
            max-width: 700px;
        }
        #page {
            width: 100%;
            height: 400px;
            font-size: 18px;
            resize: none;
            outline: none;
            border: none;
            overflow: hidden;
            line-height: 1.5;
            background: #fff;
            padding: 1rem;
            box-sizing: border-box;
        }
        #page::selection {
            background: none;
        }
        #meta {
            margin-top: 1rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }
        #bar {
            height: 10px;
            width: 200px;
            background: #eee;
            position: relative;
        }
        #fill {
            height: 10px;
            background: #333;
            width: 0%;
        }
        button, select {
            padding: 0.3rem 0.7rem;
            font-size: 1rem;
        }
    </style>
</head>
<body>
<div id="container">
    <textarea id="page" spellcheck="false" autofocus></textarea>
    <div id="meta">
        <button id="next">▶</button>
        <span id="page-num"></span>
        <div id="bar"><div id="fill"></div></div>
        <select id="page-count"></select>
        <button id="export">Export Book</button>
    </div>
</div>
<script>
    const storageKey = 'typewriter-book'
    const pageCountKey = 'typewriter-book-pages'
    let storedPages = JSON.parse(localStorage.getItem(storageKey)) || []
    let storedPageCount = parseInt(localStorage.getItem(pageCountKey)) || 1
    let totalPages = [1, 2, 4, 8].find(n => n >= storedPages.length && n >= storedPageCount) || 8
    let pages = [...storedPages, ...Array(totalPages - storedPages.length).fill('')]

    const textarea = document.getElementById('page')
    const pageNum = document.getElementById('page-num')
    const fill = document.getElementById('fill')
    const select = document.getElementById('page-count')
    let currentPage = 0

    const save = () => {
        pages[currentPage] = textarea.value
        localStorage.setItem(storageKey, JSON.stringify(pages))
    }

    const render = () => {
        textarea.value = pages[currentPage]
        pageNum.textContent = `${currentPage + 1} / ${totalPages}`
        updateFill()
        forceCaretToEnd()
    }

    const populateOptions = () => {
        const used = pages.filter(p => p.trim() !== '').length
        select.innerHTML = ''
        ;[1, 2, 4, 8].forEach(n => {
            if (n >= used) {
                const option = document.createElement('option')
                option.value = n
                option.textContent = `${n} Page${n > 1 ? 's' : ''}`
                if (n === totalPages) option.selected = true
                select.appendChild(option)
            }
        })
    }

    const forceCaretToEnd = () => {
        const len = textarea.value.length
        textarea.setSelectionRange(len, len)
    }

    const isFull = () => textarea.scrollHeight > textarea.clientHeight
    const fullnessRatio = () => Math.min(1, textarea.scrollHeight / textarea.clientHeight)
    const updateFill = () => {
        const ratio = fullnessRatio()
        fill.style.width = `${Math.min(1, ratio / 0.8) * 100}%`
    }

    textarea.addEventListener('input', e => {
        if (e.inputType.startsWith('delete') || isFull()) {
            textarea.value = pages[currentPage]
            forceCaretToEnd()
            return
        }
        save()
        updateFill()
        forceCaretToEnd()
    })

    textarea.addEventListener('keydown', e => {
        if (e.key === 'Backspace' || e.key === 'Delete' || e.ctrlKey || e.metaKey || e.altKey) {
            e.preventDefault()
        }
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End', 'PageUp', 'PageDown'].includes(e.key)) {
            e.preventDefault()
            forceCaretToEnd()
        }
    })

    textarea.addEventListener('mouseup', forceCaretToEnd)
    textarea.addEventListener('touchend', forceCaretToEnd)

    document.getElementById('next').onclick = () => {
        if (fullnessRatio() < 0.8) return
        currentPage = (currentPage + 1) % totalPages
        render()
    }

    select.addEventListener('change', () => {
        const requested = parseInt(select.value)
        if (requested > pages.length) {
            pages = [...pages, ...Array(requested - pages.length).fill('')]
        }
        totalPages = requested
        localStorage.setItem(pageCountKey, totalPages)
        if (currentPage >= totalPages) currentPage = totalPages - 1
        localStorage.setItem(storageKey, JSON.stringify(pages))
        render()
        populateOptions()
    })

    document.getElementById('export').onclick = async () => {
        const { jsPDF } = window.jspdf
        const doc = new jsPDF({ unit: 'pt', format: 'a6' })
        const margin = 24
        const lineHeight = 18
        const pageWidth = doc.internal.pageSize.getWidth()
        const pageHeight = doc.internal.pageSize.getHeight()
        const wrap = (text) => doc.splitTextToSize(text, pageWidth - margin * 2)

        doc.setFont('Courier', 'normal')
        doc.setFontSize(12)

        pages.slice(0, totalPages).forEach((text, i) => {
            if (i > 0) doc.addPage()
            const lines = wrap(text)
            lines.forEach((line, idx) => {
                if ((margin + idx * lineHeight) < (pageHeight - margin))
                    doc.text(line, margin, margin + idx * lineHeight)
            })
        })

        doc.save('book.pdf')
        localStorage.clear()
        pages = Array(1).fill('')
        totalPages = 1
        currentPage = 0
        render()
        populateOptions()
    }

    render()
    populateOptions()
</script>
</body>
</html>
